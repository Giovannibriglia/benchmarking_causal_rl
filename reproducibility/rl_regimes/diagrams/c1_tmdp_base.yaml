# C1 — the CartPole OBSERVABILITY-CONTRACT grid (2026-09-03, pre-authorised).
# RULED 2026-09-04 (option iv', §7.4): the critic axis at ONE training seed
# per dataset seed; base observational-only at three seeds for the paired
# base-vs-grace comparison. Under each truth's tag: this base cell = the
# observational critic at ts [1, 2]; c1_<truth>_critics = the full critic
# set at ts [0] (the sensitivity critic needs the observational one in the
# same run, so ts0's observational leaf comes from the critics cell); the
# sigma = 0 anchors keep their critic set at ts [0] (per (env, algo, critic)).
# The eight per-critic ds0_ts0 leaves already finished are exactly the
# critics cell's ds0 output and are skipped. Two sample sizes result, stated
# ON the report tables: return n = 3 ds x 3 ts; critic axis n = 3 ds x 1 ts.

# Cell: truth = tmdp (full-view d100 data, behaviour S->A),
# arm = base.
# Analysis is WITHIN-COLUMN only (same truth, declarations differ); the two
# truths are never lined up on a shared performance axis (contract plan §5).
# Layout: 3 dataset seeds x 3 training seeds (ds{d}_ts{t}); both algorithms.
# Source cell read via the generation reports (ids READ, never reconstructed).
regime: offline_mdp
source_cell: d_d_sweep_d100
e1_cell: c1_tmdp_base
observability: mdp
data_regime: offline
discrete_only: true
simulation: critic_ablation
diagram: D-D

generator_algo: dqn
pi_basic_epsilon: 0.5
gate_probs: [0.00, 1.00]
gate_mean_effect: 1.0
proxy_strength: 1.5

sweep:
  basic:      false
  biased:     false
  confounded: { beta: 0.0, sigma: [0.25] }

envs: [CartPole-v1]
max_workers: 1   # ad-hoc GPU work is SERIALISED (handoff GPU rule)
eval_rollout_len: 500
n_eval_envs: 16
eval_confounded_reward: true
eval_confounded_mode: analytic

algos:
  - cql
  - iql
seeds: [0, 1, 2]        # dataset seeds
train_seeds: [1, 2]     # ts0's observational leaf comes from the critics cell (iv')

# PHASE 6 — the critic axis rides on the base arm (one training run, the
# ablation critics are exploded into per-critic leaves). On D-D L2 licenses
# every comparator: observational (floor), proximal (point-ID q1/q2 via the
# declared proxies), oracle_u (ceiling; reads the recorded U), sensitivity.
critics:
  basic:      [observational]
  confounded: [observational]
