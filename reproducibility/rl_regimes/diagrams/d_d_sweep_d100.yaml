# D-D compensated gate-separation sweep -- point d = 1.00 (q = 0.00, 1.00).
#
# One YAML per sweep point; the grid (approved 2026-08-21): d in
# {1.00, 0.50, 0.25, 0.10, 0.05} at M = 1.0, sigma = 0.25 uniform. Pairs are
# SYMMETRIC about 0.5, so the MARGINAL bonus rate on gated steps is constant
# along the sweep and only the U-separation varies -- one more thing held
# fixed. d = 1.00 is (0, 1): the deterministic gate exactly, regenerated WITH
# V under its own -d100 id so the with-arm is uniformly three-proxy; the
# frozen two-proxy originals remain the historical record and the sigma = 1.0
# contrast. c_r is DERIVED as M / d in arm_knobs (no confounder_c_r line here
# BY DESIGN -- declaring both raises).
regime: offline_mdp
observability: mdp
data_regime: offline
discrete_only: true
simulation: critic_ablation
diagram: D-D

max_workers: 4
generator_algo: dqn
pi_basic_epsilon: 0.5
gate_probs: [0.00, 1.00]
gate_mean_effect: 1.0
proxy_strength: 1.5
seeds: [0, 1, 2]

algos:
  - offline_dqn
  - cql
  - iql

sweep:
  # basic: false ACKNOWLEDGES the loader's null-anchor warning deliberately:
  # the sweep's deliverables use NO per-point null calibration (recovery reads
  # logged U, the do-contrast reads the known M, and the naive-bias null scales
  # from the FROZEN sigma=0 arms by c_r).
  # THE ORIGIN, RESTORED 2026-09-01 for E1's no-harm control, reversing the
  # earlier "per-point sigma=0 companions would be redundant" call. It is not
  # redundant for THIS purpose: E1's registered no-harm prediction sat on
  # d_a_null, whose reward is constant, so its do-contrast is identically zero
  # for the data AND every resample -- an untestable pass (S9), not a clean one.
  # At sigma = 0 here U -> R survives (M = 0.5, unchanged by sigma) while
  # U -> A is severed, so the bias to remove is zero WITHOUT being zero by
  # construction. Declared under this cell rather than taken from the frozen
  # two-proxy d_d sigma=0 arms so the control is proxy-matched to the treatment
  # it sits beside. It belongs HERE and not in the confounded list: sigma = 0 IS
  # the origin, the loader rejects a zero arm value outright, and setting it
  # also clears the null-anchor warning this cell has been carrying.
  basic:      { beta: 0.0, sigma: 0.0 }
  biased:     false
  confounded: { beta: 0.0, sigma: [0.25] }

critics:
  basic:      [observational, proximal, oracle_u]
  confounded: [observational, proximal, oracle_u]
