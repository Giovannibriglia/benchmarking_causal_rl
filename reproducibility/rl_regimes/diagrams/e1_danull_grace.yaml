# E1 — the first GRACE deployment experiment (danull), 2026-08-31
#
# Generated from d_a_null.yaml: the cell's DECLARED ARMS are kept verbatim (copying the
# gate by hand would be a second construction site); only envs, the critic axis,
# the algo list and the deployment evaluation are changed.
#
# Pre-registration P1-P5 + rationale: docs/grace_v2_consolidation_plan.md
# Entry ticket (Q2-A step 3, run PER CELL, exact analytic anchor): PASSED.
#
# THE CRITIC AXIS, not new algorithm names: one shared run per (point, env,
# algo, seed) explodes into per-critic leaves, so variant and base get identical
# data, seeds and budgets BY CONSTRUCTION rather than by convention.
# D-A-null — the REFERENCE NULL arm. No latent at all.
#
# Collected through the same action-dependent policy as every other arm, but at
# sigma = 0 AND c_r = 0: U is drawn and logged, and touches neither the action
# nor the reward. So the diagram is genuinely D-A-null, not "D-B with the dial
# at zero", and any refutation L5 issues here is a false alarm by construction.
# That is what makes the false-positive rate readable without a threshold.
#
# The gate knows: with c_r = 0 the generator declares expect_gated_reward=False,
# so A4 is SKIPPED rather than tested against noise (it would pass or fail on a
# coin flip). The metadata records that it was skipped, so a later reader can
# tell "not applicable" from "passed".
regime: offline_mdp
# The generation-report cell the certified ids resolve through
# (read, never reconstructed) and the results-tree tag.
source_cell: d_a_null
e1_cell: danull
observability: mdp
data_regime: offline
discrete_only: true
simulation: critic_ablation
diagram: D-A-null

generator_algo: dqn
pi_basic_epsilon: 0.5
confounder_c_r: 0.0        # NO U->R edge: this is the whole point of the arm

# One point. The L's severity axes do not apply: there is nothing to make severe.
sweep:
  # sigma = 0 (basic): D-A-null HAS NO LATENT, so a sigma > 0 declaration is
  # rejected by the diagram-arm validator — correctly. The pilot's tree sat at
  # sigma_025 only because the driver's campaign default leaked into a cell
  # where sigma is meaningless (inert at run time: c_r = 0, sigma-free id);
  # the 12 pilot leaves were MOVED to beta_000_sigma_000 on 2026-09-03 so the
  # tree, this declaration and the validator agree. An interim fix here
  # declared sigma [0.25] to match the old tree and broke
  # test_diagram_arms — resolved in favour of the validator.
  basic:      { beta: 0.0, sigma: 0.0 }
  biased:     false
  confounded: false

# CartPole only: the Acrobot transition mechanism is unproven, so Acrobot q2 is
# not ready and the first experiment is not coupled to it.
envs: [CartPole-v1]
max_workers: 1   # ad-hoc GPU work is SERIALISED (handoff GPU rule)

# Deployment evaluation: U -> R intact, U -> A severed (the learned policy
# acts). ANALYTIC takes E_U[return] in closed form on a clean env, removing
# U-draw variance that would otherwise sit inside the seed-noise band.
# THE EVAL HORIZON, separate from rollout_len (S17: rollout_len=2 is right
# for the inert on-policy params on an offline run and was catastrophic as an
# eval horizon — every policy scored 2.0-3.0). 500 = CartPole-v1's episode
# cap. n_eval_envs=16: two rollouts per checkpoint cannot produce the MC band
# "parity within seed noise" is judged against.
eval_rollout_len: 500
n_eval_envs: 16
eval_confounded_reward: true
eval_confounded_mode: analytic

# Baselines are cql and iql UNMODIFIED; offline_dqn is in the source cells but
# is not part of this experiment's contrast.
algos:
  - cql
  - iql

# Three DATASET seeds, matched across cells so per-seed reporting pairs
# (d_a_null declares five; the extra two would have no counterpart).
seeds: [0, 1, 2]

# observational = the BASE arm (unmodified base critic); grace = the variant.

# The GRACE arm: the SAME algorithm, the SAME transitions, the SAME seeds --
# one column different. GRACE is a reward transform rather than a critic
# because on these cells confounding is confined to the reward channel
# (catalogue fact 3: no U -> S_next), so Q_do IS the base algorithm's value on
# interventional rewards. Base-parity is therefore stronger than "same
# batches": the algorithm is untouched.
grace_reward_transform: true
grace_proxy_names: []

critics:
  basic:      [observational]
  confounded: [observational]
