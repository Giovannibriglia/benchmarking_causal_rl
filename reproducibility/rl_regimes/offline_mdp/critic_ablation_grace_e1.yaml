# offline_mdp / CRITIC ABLATION — Block A (GRACE E1), SCOPED run config.
#
# A scoped sibling of the canonical `critic_ablation.yaml` (which is the
# REGISTERED cell, pinned by tests — do not edit it for a run's scope). Same
# L, same critic sets, same production budget; only the env and algo axes are
# narrowed:
#
#   envs:  CartPole-v1 only     (Acrobot deferred)
#   algos: cql, iql only        (offline_dqn / bcq deferred)
#
# WHY these two axes, and why this is not a quality compromise: the stored
# INDEPENDENT null-calibration references (`_base/null_cal_reference.yaml`)
# exist for CartPole-v1 x {cql, iql} and nothing else. Acrobot is deliberately
# unreferenced, and offline_dqn / bcq have no reference on CartPole either, so
# under the R-N1.1 guardrails their G1/G2 verdicts could only ever be
# PROVISIONAL (coupled reference) and could never carry a headline claim.
# Restricting to the two calibrated bases is what makes it affordable to keep
# ALL 7 sweep points and ALL 5 seeds — preserving the sigma-wedge, the
# beta-coverage curve, and the pooled seed-sd that is the denominator of every
# verdict. Seeds are NOT thinned: 3 seeds would weaken all four gates at once.
#
# The deferred axes run later as background jobs that gate no report:
# Acrobot (both bases) and offline_dqn / bcq on CartPole. Consequence to state
# in the report and docs/grace.md: with Acrobot deferred, GRACE's A8 FACTORED
# per-dimension transition mode is UNEXERCISED at production scale (CartPole's
# 6^4 = 1296 joint states stay under the 2048 joint cap, so Block A runs the
# exact-joint path only). The R1 state-space risk is NOT closed by Block A.
#
# Run:
#   bash tools/run_grace_block.sh rl_regimes/offline_mdp/critic_ablation_grace_e1.yaml
# Report/figures:
#   uv run python -m src.benchmarking.regime_report offline_mdp
#   uv run python -m src.benchmarking.render_regime_report offline_mdp
regime: offline_mdp
observability: mdp
data_regime: offline
discrete_only: true
simulation: critic_ablation

max_workers: 4

generator_algo: dqn
pi_basic_epsilon: 0.5
confounder_c_r: 1.0

# Scoped axes (the canonical cell inherits both from ../_base).
envs:
  - CartPole-v1
algos:
  - cql
  - iql

# The canonical 7-point L, unchanged.
sweep:
  basic:      { beta: 0.0,                sigma: 0.0 }
  biased:     { beta: [0.25, 0.50, 0.75], sigma: 0.0 }
  confounded: { beta: 0.0,                sigma: [0.25, 0.50, 1.00] }

# Critic sets identical to the canonical cell (grace on every arm so its
# router verdict is scored against all three arm labels for G4;
# grace_no_router where a causal gap exists to close).
critics:
  basic:      [observational, proximal, oracle_u, sensitivity, grace, grace_no_router]
  biased:     [observational, grace]
  confounded: [observational, proximal, oracle_u, sensitivity, grace, grace_no_router]
