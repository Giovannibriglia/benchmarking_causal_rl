# offline_mdp / HOSTED — MuJoCo locomotion, SIMPLE tier (the low end of the
# hosted behavior-quality axis; see hosted_mujoco_expert.yaml).
#
# Run (no pinned seed; replicate with --seed 0 / 1 / 2):
#   uv run python main.py --reproduce rl_regimes/offline_mdp/hosted_mujoco_simple.yaml --seed 0
envs:
  - Hopper-v5
  - HalfCheetah-v5
offline_dataset:
  Hopper-v5: mujoco/hopper/simple-v0
  HalfCheetah-v5: mujoco/halfcheetah/simple-v0
algos:
  - cql_continuous
  - iql_continuous
  - bcq_continuous
offline_grad_steps: 50000
n_checkpoints: 25
n_episodes: 25
rollout_len: 512
n_train_envs: 2
n_eval_envs: 16
# Sparse terminal reward (MiniGrid success / MuJoCo terminal step): count the
# done-step reward at eval (the legacy default drops it, reading 0.0 forever
# on MiniGrid-family envs regardless of policy quality).
eval_count_terminal_reward: true
aggregation: iqm
deterministic: true
