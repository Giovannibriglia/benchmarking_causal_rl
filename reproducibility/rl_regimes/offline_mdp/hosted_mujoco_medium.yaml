# offline_mdp / HOSTED — MuJoCo locomotion, MEDIUM tier (see hosted_mujoco_expert.yaml).
#
# Run (no pinned seed; replicate with --seed 0 / 1 / 2):
#   uv run python main.py --reproduce rl_regimes/offline_mdp/hosted_mujoco_medium.yaml --seed 0
envs:
  - Hopper-v5
  - HalfCheetah-v5
offline_dataset:
  Hopper-v5: mujoco/hopper/medium-v0
  HalfCheetah-v5: mujoco/halfcheetah/medium-v0
algos:
  - cql_continuous
  - iql_continuous
  - bcq_continuous
offline_grad_steps: 50000
n_checkpoints: 25
n_episodes: 25
rollout_len: 512
n_train_envs: 2
n_eval_envs: 16
aggregation: iqm
deterministic: true
