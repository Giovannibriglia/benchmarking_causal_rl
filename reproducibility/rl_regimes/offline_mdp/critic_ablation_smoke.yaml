# offline_mdp / CRITIC ABLATION SMOKE — tiny-budget dry run of the strategy-critic
# ablation (full L, 1 env / 1 algo / 1 seed, ~1-2 min). Run with:
#   uv run python main.py --reproduce rl_regimes/offline_mdp/critic_ablation_smoke.yaml
# Routed to results_smoke/ (the --reproduce dispatch keys on "smoke" in the filename).
regime: offline_mdp
observability: mdp
data_regime: offline
discrete_only: true
simulation: critic_ablation

max_workers: 1

generator_algo: dqn
pi_basic_epsilon: 0.5
confounder_c_r: 1.0

# tiny overrides of the ../_base defaults
envs:
  - CartPole-v1
algos:
  - cql
seeds:
  - 0
budgets:
  n_episodes: 20
  n_checkpoints: 2
  n_train_envs: 2
  n_eval_envs: 2
  rollout_len: 2
  rollout_episodes: 40
  offline_grad_steps: 40
