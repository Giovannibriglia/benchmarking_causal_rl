# offline_mdp / HOSTED — Farama-hosted MuJoCo locomotion, EXPERT tier.
#
# Continuous hosted companion to classical.yaml: the continuous offline learners
# on the SB3-SAC-generated MuJoCo datasets (~1M steps per env; sizeable first
# download from the HF remote). One config per tier — expert / medium / simple —
# is the hosted behavior-quality axis (unpaired tiers, unlike our
# shared-generator beta arms; see docs/minari_adoption_report.md §2.1). No
# causal arms: hosted data has no confounder U and no signature.
#
# Env versions pinned to the datasets' own env_spec (Hopper-v5 / HalfCheetah-v5).
# Requires the mujoco extra; obs are flat Box (the frozen fill handles them —
# no adapter involved).
#
# Run (no pinned seed; replicate with --seed 0 / 1 / 2):
#   uv run python main.py --reproduce rl_regimes/offline_mdp/hosted_mujoco_expert.yaml --seed 0
envs:
  - Hopper-v5
  - HalfCheetah-v5
offline_dataset:
  Hopper-v5: mujoco/hopper/expert-v0
  HalfCheetah-v5: mujoco/halfcheetah/expert-v0
algos:
  - cql_continuous
  - iql_continuous
  - bcq_continuous
offline_grad_steps: 50000
n_checkpoints: 25
n_episodes: 25
rollout_len: 512
n_train_envs: 2
n_eval_envs: 16
# Sparse terminal reward (MiniGrid success / MuJoCo terminal step): count the
# done-step reward at eval (the legacy default drops it, reading 0.0 forever
# on MiniGrid-family envs regardless of policy quality).
eval_count_terminal_reward: true
aggregation: iqm
deterministic: true
