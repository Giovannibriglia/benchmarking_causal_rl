# online_pomdp / CLASSICAL — the plain ONLINE benchmark over the L, PARTIAL
# observability (masked obs; the learner runs the recurrent lstm critic trunk).
# Leaves: results/online_pomdp/classical/beta_*_sigma_*/{env}/{algo}/{seed}/
#
# Run:
#   uv run python main.py --reproduce rl_regimes/online_pomdp/classical.yaml
regime: online_pomdp
observability: pomdp
data_regime: online
discrete_only: true
simulation: classical

# (env, seed) groups run concurrently; online groups need no Minari isolation.
max_workers: 4

pi_basic_epsilon: 0.5
confounder_c_r: 1.0

mask_indices:
  CartPole-v1: [1, 3]
  Acrobot-v1: [4, 5]

sweep:
  basic:      { beta: 0.0,                sigma: 0.0 }
  biased:     { beta: [0.25, 0.50, 0.75], sigma: 0.0 }
  confounded: { beta: 0.0,                sigma: [0.25, 0.50, 1.00] }

# EXPLICIT algo selection (name__actor__critic form pins the trunks). dqn is
# the only discrete online learner with a recurrent variant, so the pair is the
# standard POMDP baseline comparison on the SAME masked obs: recurrent (lstm)
# vs memoryless (mlp). online_dqn_proximal is excluded here (mlp-only — it
# would confound the memory axis with the deconfounding axis).
algos:
  - dqn__lstm__lstm              # recurrent learner (the pomdp-designed row)
  - dqn__mlp__mlp                # memoryless baseline on the masked obs
