# online_mdp / CLASSICAL — the plain ONLINE benchmark over the L (full observability).
#
# ONLINE: there is no offline dataset and no generator to share — each arm point is
# an ordinary online run whose FIXED behavior policy realizes the arm (basic /
# confounded collect via bias_confounded_action on the shared pi_basic; biased via
# the biased policy; the online intervened gate applies). Cross-arm deltas are NOT
# generator-paired (nothing to pair — the arms differ by collection policy only).
# Leaves: results/online_mdp/classical/beta_*_sigma_*/{env}/{algo}/{seed}/
#
# Run:
#   uv run python main.py --reproduce rl_regimes/online_mdp/classical.yaml
regime: online_mdp
observability: mdp
data_regime: online
discrete_only: true
simulation: classical

# (env, seed) groups run concurrently (the supervisor is driver-agnostic; online
# groups need no Minari store isolation). 4 is memory-safe on a 16 GB GPU.
max_workers: 4

pi_basic_epsilon: 0.5
confounder_c_r: 1.0

sweep:
  basic:      { beta: 0.0,                sigma: 0.0 }
  biased:     { beta: [0.25, 0.50, 0.75], sigma: 0.0 }
  confounded: { beta: 0.0,                sigma: [0.25, 0.50, 1.00] }

# EXPLICIT algo selection. The online arm policies are OFF-POLICY collection
# seams (an on-policy learner ignores behavior_policy — a structural no-op the
# runner refuses) and the cells are DISCRETE ONLY (sac/ddpg are continuous), so
# the designed-for set is dqn + its deconfounding variant: online_dqn_proximal
# (Gate B) is a genuinely different learner built for exactly this confounded
# online collection. The _base algo list is offline-only, so never inherited.
algos:
  - dqn
  - online_dqn_proximal
