# online_mdp / CRITIC ABLATION SMOKE — tiny-budget dry run of the online strategy
# comparison (full L, 1 env / 1 seed). Run with:
#   uv run python main.py --reproduce rl_regimes/online_mdp/critic_ablation_smoke.yaml
regime: online_mdp
observability: mdp
data_regime: online
discrete_only: true
simulation: critic_ablation

max_workers: 1

pi_basic_epsilon: 0.5
confounder_c_r: 1.0

envs:
  - CartPole-v1
algos:
  - dqn
seeds:
  - 0
critics:
  basic:      [observational, proximal, grace]
  biased:     [observational, grace]
  confounded: [observational, proximal, grace]
budgets:
  # 20 x 64 x 2 = 2560 collection steps crosses the 1000-step off-policy warmup.
  n_episodes: 20
  n_checkpoints: 2
  n_train_envs: 2
  n_eval_envs: 2
  rollout_len: 64
