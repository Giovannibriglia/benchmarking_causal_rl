# online_mdp — LEGACY ALIAS. The cell is split into two simulation components:
#   classical.yaml       (plain online benchmark: algo x env, no critic axis)
#   critic_ablation.yaml (online strategy comparison: dqn vs online_dqn_proximal)
# Use those (+ their *_smoke.yaml variants). This file stays runnable as the
# critic-ablation simulation for backward compatibility.
regime: online_mdp
observability: mdp
data_regime: online
discrete_only: true
simulation: critic_ablation

max_workers: 1

pi_basic_epsilon: 0.5
confounder_c_r: 1.0

sweep:
  basic:      { beta: 0.0,                sigma: 0.0 }
  biased:     { beta: [0.25, 0.50, 0.75], sigma: 0.0 }
  confounded: { beta: 0.0,                sigma: [0.25, 0.50, 1.00] }

# The _base algo list is offline-only; the online cell trains dqn (its strategy
# variants resolve per the critics sets, as in critic_ablation.yaml).
algos:
  - dqn

critics:
  basic:      [observational, proximal]
  biased:     [observational]
  confounded: [observational, proximal]
