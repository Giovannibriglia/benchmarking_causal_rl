# offline_pomdp / HOSTED — BabyAI GoToRedBallNoDists, FULL-obs dataset twin.
#
# The observability ceiling for hosted_babyai.yaml: SAME task, SAME near-optimal
# behavior policy, but the dataset records the WHOLE grid (8x8 symbolic, 192-dim
# flattened) — the hosted analog of running the POMDP cell unmasked. Memoryless
# learner only: with full observability the memory row is redundant.
# env_kwargs.full_obs makes the eval env encoding match the dataset
# (FullyObsWrapper before the symbolic flatten).
#
# Run (no pinned seed; replicate with --seed 0 / 1 / 2):
#   uv run python main.py --reproduce rl_regimes/offline_pomdp/hosted_babyai_fullobs.yaml --seed 0
envs:
  - BabyAI-GoToRedBallNoDists-v0
env_wrapper: minigrid_symbolic
env_kwargs:
  full_obs: true
offline_dataset:
  BabyAI-GoToRedBallNoDists-v0: minigrid/BabyAI-GoToRedBallNoDists/optimal-fullobs-v0
algos:
  - offline_dqn
offline_grad_steps: 20000
n_checkpoints: 10
n_episodes: 10
rollout_len: 512
n_train_envs: 2
n_eval_envs: 16
aggregation: iqm
deterministic: true
