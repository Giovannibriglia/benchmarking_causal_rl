# offline_pomdp / CRITIC ABLATION SMOKE — tiny-budget dry run (full L, 1 env /
# 1 algo / 1 seed). Run with:
#   uv run python main.py --reproduce rl_regimes/offline_pomdp/critic_ablation_smoke.yaml
regime: offline_pomdp
observability: pomdp
data_regime: offline
discrete_only: true
simulation: critic_ablation

max_workers: 1

generator_algo: dqn
pi_basic_epsilon: 0.5
confounder_c_r: 1.0

mask_indices:
  CartPole-v1: [1, 3]

envs:
  - CartPole-v1
algos:
  - offline_dqn_recurrent
seeds:
  - 0
budgets:
  n_episodes: 20
  n_checkpoints: 2
  n_train_envs: 2
  n_eval_envs: 2
  rollout_len: 2
  rollout_episodes: 40
  offline_grad_steps: 40

# Smoke exercises the recurrent grace arms end-to-end (tiny latent/EM budgets).
critics:
  basic:      [observational, proximal, oracle_u, sensitivity, grace, grace_no_router]
  biased:     [observational, grace]
  confounded: [observational, proximal, oracle_u, sensitivity, grace, grace_no_router]
grace:
  em_iters: 3
  pomdp_em_iters: 4
  n_latent: 6
  ensemble_k: 2
  n_bins: 3
