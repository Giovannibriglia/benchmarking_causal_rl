# offline_pomdp / CRITIC ABLATION — the strategy-critic comparison over the L,
# PARTIAL observability (the Cell-8 recurrent row: masked obs, lstm encoder).
# Leaves: results/offline_pomdp/beta_*_sigma_*/{env}/{algo}/{critic}/{seed}/
# (historical sweep.yaml behavior; sweep.yaml remains a legacy alias).
#
# Run:
#   uv run python main.py --reproduce rl_regimes/offline_pomdp/critic_ablation.yaml
regime: offline_pomdp
observability: pomdp
data_regime: offline
discrete_only: true
simulation: critic_ablation

# (env, seed) groups run concurrently; 4 is memory-safe on a 16 GB GPU.
max_workers: 4

generator_algo: dqn
pi_basic_epsilon: 0.5
confounder_c_r: 1.0

# Masked obs indices per env (the observability axis: hide the velocities).
mask_indices:
  CartPole-v1: [1, 3]
  Acrobot-v1: [4, 5]

sweep:
  basic:      { beta: 0.0,                sigma: 0.0 }
  biased:     { beta: [0.25, 0.50, 0.75], sigma: 0.0 }
  confounded: { beta: 0.0,                sigma: [0.25, 0.50, 1.00] }

# The recurrent strategy triad is DQN-base only (Cell 8): offline_dqn_recurrent
# accepts the lstm critic_network the pomdp arm forces.
algos:
  - offline_dqn_recurrent

critics:
  basic:      [observational, proximal, oracle_u, sensitivity]
  biased:     [observational]
  confounded: [observational, proximal, oracle_u, sensitivity]
