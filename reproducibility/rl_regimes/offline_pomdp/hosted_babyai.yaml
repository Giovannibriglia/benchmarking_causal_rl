# offline_pomdp / HOSTED SWEEP — BabyAI, OBSERVABILITY axis (partial vs fullobs).
#
# The hosted analog of the masked-obs POMDP cell as a sweep: the arms are the
# dataset pairs the remote provides with the SAME near-optimal behavior policy —
# `partial` records the 7x7 egocentric view (147-dim), `fullobs` the whole grid
# (per-arm env_kwargs switch the eval env encoding to match). Full 2x2: BOTH
# algos (recurrent memory row + memoryless baseline) run on BOTH arms —
# fullobs-recurrent is the control that memory only helps when observability is
# missing. Two envs on the task-memory axis:
#   * GoToRedBallNoDists — near-Markovian under the egocentric view (fixed
#     mission, no distractors): memory has ~nothing to win; kept as the
#     no-memory-needed control.
#   * KeyCorridorS3R1 — key -> locked door -> ball sequencing (18-step optimal
#     episodes): the egocentric view forces remembering what was seen; the
#     smallest genuinely memory-demanding hosted pair.
# Leaves:
#   results/offline_pomdp/hosted_babyai/{arm}/{env}/{algo}/{seed}/  (resumable)
# No mask_indices involved (partial observability comes from the dataset), no
# causal arms. CAVEAT (see docs/minari_adoption_report.md, BabyAI audit): the
# algo rows are the DQN family (the only base with a recurrent variant) and
# naive DQN collapses on narrow near-expert data — read the memory question
# WITHIN the family (recurrent vs memoryless DQN), not as absolute returns;
# recurrent-cql remains a deferred workstream.
#
# Run:
#   uv run python main.py --reproduce rl_regimes/offline_pomdp/hosted_babyai.yaml
# Report/figures:
#   uv run python -m src.benchmarking.render_hosted_report offline_pomdp --simulation hosted_babyai
regime: offline_pomdp
simulation: hosted_babyai
env_wrapper: minigrid_symbolic

datasets:
  partial:
    offline_dataset:
      BabyAI-GoToRedBallNoDists-v0: minigrid/BabyAI-GoToRedBallNoDists/optimal-v0
      BabyAI-KeyCorridorS3R1-v0: minigrid/BabyAI-KeyCorridorS3R1/optimal-v0
  fullobs:
    offline_dataset:
      BabyAI-GoToRedBallNoDists-v0: minigrid/BabyAI-GoToRedBallNoDists/optimal-fullobs-v0
      BabyAI-KeyCorridorS3R1-v0: minigrid/BabyAI-KeyCorridorS3R1/optimal-fullobs-v0
    env_kwargs:
      full_obs: true

algos:
  # Memory row — the explicit networks block is REQUIRED (a plain string
  # defaults every component to mlp, which the recurrent builder rejects).
  - {name: offline_dqn_recurrent, networks: {critic: lstm}}
  - offline_dqn               # memoryless baseline (same base as the memory row)
  # Competent memoryless reference (audit finding): CQL recovers the behavior
  # policy on KeyCorridor-FULLOBS (0.94/100%) but is structurally capped at 0
  # on KeyCorridor-PARTIAL (carrying-state unobservable) — the observability
  # wedge this row makes visible inside the sweep. Closing it from the partial
  # side needs recurrent-cql (deferred workstream).
  - cql

seeds: [0, 1, 2]

offline_grad_steps: 20000     # matches the offline_pomdp classical budget
n_checkpoints: 10
n_train_envs: 2
n_eval_envs: 16
rollout_len: 512
aggregation: iqm
eval_count_terminal_reward: true
