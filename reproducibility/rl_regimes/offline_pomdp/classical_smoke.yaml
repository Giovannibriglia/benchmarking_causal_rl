# offline_pomdp / CLASSICAL SMOKE — tiny-budget dry run (full L, 1 env / 1 algo /
# 1 seed). Run with:
#   uv run python main.py --reproduce rl_regimes/offline_pomdp/classical_smoke.yaml
regime: offline_pomdp
observability: pomdp
data_regime: offline
discrete_only: true
simulation: classical

max_workers: 1

generator_algo: dqn
pi_basic_epsilon: 0.5
confounder_c_r: 1.0

mask_indices:
  CartPole-v1: [1, 3]

envs:
  - CartPole-v1
# TWO rows: the recurrent learner + the memoryless mlp baseline on the same
# masked obs (explicit trunks; see classical.yaml).
algos:
  - offline_dqn_recurrent
  - offline_dqn__mlp__mlp
seeds:
  - 0
budgets:
  n_episodes: 20
  n_checkpoints: 2
  n_train_envs: 2
  n_eval_envs: 2
  rollout_len: 2
  rollout_episodes: 40
  offline_grad_steps: 40
